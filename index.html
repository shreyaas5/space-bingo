<!doctype html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TAAS Space Bingo — 7×7</title>
  <style>
    /* ---- STYLES UNCHANGED ---- */
    :root{
      --bg:#071029; --panel:#0f2436; --accent:#69b3ff; --card:#061427;
      --cell:#0b324a; --cell-tick:rgba(105,179,255,0.25);
    }
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#021126 0%, #051831 60%);
      color:#e6f2ff;-webkit-font-smoothing:antialiased;}
    header{padding:18px 22px; display:flex; gap:12px; align-items:center;}
    h1{margin:0;font-size:20px;letter-spacing:0.4px}
    .container{max-width:1100px;margin:10px auto;padding:10px;}
    .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between}
    .controls{display:flex;gap:10px;align-items:center}
    button{background:linear-gradient(180deg,var(--accent),#3b9eea);color:#012238;border:0;padding:8px 12px;border-radius:8px;
      font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(6,40,70,0.25);}
    button.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1px solid rgba(105,179,255,0.12)}
    .grid-wrap{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
    .card{background:linear-gradient(180deg,var(--card), rgba(255,255,255,0.02));
      border-radius:10px;padding:14px;box-shadow:0 8px 30px rgba(2,6,23,0.6);flex:1 1 420px;min-width:320px;max-width:48%;}
    .card h2{margin:0 0 6px 0;font-size:16px}
    .bingo-grid{display:grid; gap:6px;grid-template-columns: repeat(7, minmax(0,1fr));user-select:none;}
    .cell{background:var(--cell); padding:10px; border-radius:8px; min-height:60px;
      display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;
      font-size:12px;color:#dff3ff;cursor:pointer; position:relative;
      transition:transform .08s, box-shadow .12s;}
    .cell:active{transform:scale(.99)}
    .tick{position:absolute; inset:6px; border-radius:6px; display:none; pointer-events:none;
      background:var(--cell-tick); border:2px solid rgba(105,179,255,0.14);}
    .cell.ticked .tick{display:block}
    .meta{display:flex;gap:8px;align-items:center;margin-top:10px; font-size:13px}
    .small{font-size:12px; color:#a8d5ff}
    .host-panel{background:rgba(0,0,0,0.06); padding:12px;border-radius:8px}
    .calls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .call-pill{background:rgba(255,255,255,0.04); padding:6px 8px;border-radius:8px;font-size:12px}
    .claimed{color:#8fffc9}
    footer{margin-top:20px;color:#a9d8ff;font-size:12px}
    .hint{color:#9ac7ff;font-size:13px}
    .pattern-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .pattern{background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:8px;font-size:13px}
    @media (max-width:900px){.card{max-width:100%}.topbar{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
